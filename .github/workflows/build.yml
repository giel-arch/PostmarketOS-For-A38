name: Build postmarketOS (OPPO A38)

on:
  push:
    branches: [main]
    paths-ignore:
      - "mainline/**"
      - "halium/**"
      - "tools/**"
      - ".github/workflows/build-mainline.yml"
  workflow_dispatch:

jobs:
  pmos:
    name: Kernel + pmbootstrap + repack
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Checkout repo ini
        uses: actions/checkout@v4

      - name: Checkout repo kernel PMOS (fragment + assets)
        uses: actions/checkout@v4
        with:
          repository: giel-arch/Kernel-mt6769-a38-PMOS
          ref: main
          path: kernel-pmos

      - name: Checkout source kernel (giel-arch/kernel-mt6769-a38)
        uses: actions/checkout@v4
        with:
          repository: giel-arch/kernel-mt6769-a38
          ref: main
          path: kernel
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            gcc-aarch64-linux-gnu git libssl-dev python3 zstd lz4 cpio

      - name: Build kernel (config pmOS)
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
          git clone --depth=1 \
            https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r510928.git \
            "$GITHUB_WORKSPACE/toolchain"
          cd kernel
          # JANGAN kosongkan scripts/setlocalversion (lihat catatan di
          # workflow Kernel-mt6769-a38-PMOS)
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 oppo_a38_defconfig
          ./scripts/kconfig/merge_config.sh -m -O out \
            out/.config ../kernel-pmos/pmos.fragment
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 olddefconfig
          make -j"$(nproc)" O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- Image.gz
          cp out/arch/arm64/boot/Image.gz \
            "$GITHUB_WORKSPACE/device/testing/linux-oppo-a38/Image.gz"

      - name: Install pmbootstrap
        run: |
          pipx install git+https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          # runner pakai python3.10: pmbootstrap butuh tomli (<3.11)
          pipx inject pmbootstrap tomli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Siapkan aports (device + kernel + modul vendor)
        run: |
          # tarball modul + force_insmod.c harus se-dir dengan APKBUILD
          cp assets/vendor-modules.tar.xz device/testing/mtk-vendor-modules/
          cp scripts/force_insmod.c device/testing/mtk-vendor-modules/
          # init pmbootstrap non-interaktif (clone pmaports)
          yes "" | pmbootstrap init || true
          PMAPORTS="$HOME/.local/var/pmbootstrap/cache_git/pmaports"
          test -d "$PMAPORTS/device/testing" || {
            echo "pmaports tidak ter-clone!"; exit 1; }
          cp -r device/testing/* "$PMAPORTS/device/testing/"
          pmbootstrap config device oppo-a38
          pmbootstrap config ui console
          # OpenRC: layanan usb-gadget (init.d) butuh ini; systemd edge
          # tidak tersedia di binary repo sehingga build order gagal
          pmbootstrap config service_manager openrc
          pmbootstrap config user user
          pmbootstrap config hostname oppo-a38

      - name: Checksum & build rootfs
        run: |
          pmbootstrap checksum linux-oppo-a38
          pmbootstrap checksum device-oppo-a38
          pmbootstrap checksum mtk-vendor-modules
          # Jangan rebuild paket upstream yang "outdated" (pmaports dirty
          # karena kita menambah device pkg). pmbootstrap otomatis
          # membuild device-oppo-a38 / linux-oppo-a38 /
          # mtk-vendor-modules karena tidak ada di binary repo.
          pmbootstrap config build_pkgs_on_install false
          # pmbootstrap kadang flake saat unmount qemu-aarch64-static
          # (target is busy) - retry sampai 3x, zap chroot di antaranya
          for i in 1 2 3; do
            printf '147147\n147147\n' | pmbootstrap install \
              --password 147147 && break
            echo "::warning::pmbootstrap install gagal (percobaan $i)"
            tail -n 120 "$HOME/.local/var/pmbootstrap/log.txt"
            [ "$i" -eq 3 ] && exit 1
            pmbootstrap zap || true
          done
          pmbootstrap export

      - name: Repack boot + init_boot (magiskboot)
        run: |
          chmod +x scripts/*.sh
          EXPORT_DIR=$(ls -d /tmp/postmarketOS-export* | head -n 1)
          # rootfs: ganti jadi ext4 murni (partisi root saja) + suntik
          # /boot -> root langsung /dev/mmcblk0p59 via mode stowaway
          scripts/postprocess-rootfs.sh "$EXPORT_DIR"
          # init_boot: initramfs utama SAJA (partisi init_boot hanya 8MB)
          scripts/repack-initboot.sh "$GITHUB_WORKSPACE" \
            "$EXPORT_DIR" "$EXPORT_DIR/init_boot-pmos.img"

          # boot-pmos.img: kernel pmOS ke boot_b stok (kernel saja)
          cd "$EXPORT_DIR"
          curl -sL -o magisk.apk \
            https://github.com/topjohnwu/Magisk/releases/download/v28.1/Magisk-v28.1.apk
          python3 -c "import zipfile; zipfile.ZipFile('magisk.apk').extract('lib/x86_64/libmagiskboot.so')"
          cp lib/x86_64/libmagiskboot.so magiskboot && chmod +x magiskboot
          cp "$GITHUB_WORKSPACE/kernel-pmos/assets/boot_b.bin" .
          ./magiskboot unpack boot_b.bin
          # PENTING: cp SETELAH unpack (unpack menulis file 'kernel' stok)
          cp "$GITHUB_WORKSPACE/device/testing/linux-oppo-a38/Image.gz" kernel
          ./magiskboot repack boot_b.bin boot-pmos.img
          rm -f ramdisk.cpio kernel dtb boot_signature header boot_b.bin magisk.apk
          cp "$GITHUB_WORKSPACE/assets/vbmeta_b.bin" .

          cat > FLASH.txt <<'EOF'
          === postmarketOS/Nura OPPO A38 (ossi) - slot B ===
          Perangkat harus di fastboot/bootloader: adb reboot bootloader
          1. fastboot flash boot_b boot-pmos.img
          2. fastboot flash init_boot_b init_boot-pmos.img
          3. fastboot flash userdata oppo-a38.img      (MENGHAPUS data Android!)
          4. fastboot flash vbmeta_b --disable-verity --disable-verification vbmeta_b.bin
          5. fastboot reboot

          SSH via USB: host pakai IP 172.16.42.2, lalu:
            ssh root@172.16.42.1   (password 147147)
          Restore Android: flash ulang boot_b/init_boot_b/vbmeta_b stok
          (dump ada di ~/WorkSpace/OPPO A38/) + reflashing super/userdata.
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmOS-oppo-a38
          path: |
            /tmp/postmarketOS-export*/boot-pmos.img
            /tmp/postmarketOS-export*/init_boot-pmos.img
            /tmp/postmarketOS-export*/oppo-a38.img
            /tmp/postmarketOS-export*/vbmeta_b.bin
            /tmp/postmarketOS-export*/FLASH.txt
          if-no-files-found: error
